name: flutty_app_update
description: "Forced and recommended app updates driven by remote config: a blocking page below a minimum version, a dismissible banner below a recommended version."
version: 0.3.0
homepage: https://github.com/Flutty-Lab/flutty_app_update
repository: https://github.com/Flutty-Lab/flutty_app_update
issue_tracker: https://github.com/Flutty-Lab/flutty_app_update/issues
topics:
  - app-update
  - force-update
  - remote-config
  - versioning
  - ui

environment:
  sdk: ">=3.13.0 <4.0.0"
  flutter: ">=3.47.0"


dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.5.4

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  mocktail: ^1.0.4
